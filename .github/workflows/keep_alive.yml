steps:
      - name: Full Page Request
        run: |
          # --max-time: stop after 20 seconds
          # --retry: try 3 times if it hits a transient network error
          # -k: allow "insecure" SSL if the redirect certificates are wonky
          curl -L -k --max-time 20 --retry 3 -A "Mozilla/5.0" https://ng-health-dashboard.streamlit.app/ | head -n 10
          echo "Knocked on the door at $(date)"